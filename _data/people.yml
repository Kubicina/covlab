# CoVLab People Data
# ===================
# Each entry here corresponds to a lab member displayed on the /people/ page.
#
# Fields:
#   name        : Full name with diacritics (e.g., Jana Nováková)
#   title       : Academic title or role (e.g., Prof., Dr., MSc., PhD student)
#   role        : Position label shown below the name (e.g., Principal Investigator, Postdoctoral Researcher)
#   image       : Filename relative to assets/img/people/ (e.g., jana_novakova.jpg)
#                 Use placeholder.jpg until a real photo is available.
#   expertise   : Short list of research interests (Markdown supported)
#   email       : Contact email (optional)
#   orcid       : ORCID iD without the URL prefix (optional, e.g., 0000-0000-0000-0000)
#   scholar     : Google Scholar profile URL (optional)
#   website     : Personal or institutional website URL (optional)
#   content     : Filename of the per-person _pages/ content file for extended bio (optional)
#                 If omitted, only the card fields above are shown.
#   group       : Organisational group for sectioned display.
#                 Use one of: principal_investigators, researchers, phd_students, master_students, alumni
#   active      : Set to false to move a member to the Alumni section without deleting the entry.

